name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target_os }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            target_os: linux
            ext: ""
          - goos: linux
            goarch: arm64
            target_os: linux
            ext: ""
          - goos: darwin
            goarch: amd64
            target_os: osx
            ext: ""
          - goos: darwin
            goarch: arm64
            target_os: osx
            ext: ""
          - goos: windows
            goarch: amd64
            target_os: windows
            ext: ".exe"
          - goos: windows
            goarch: arm64
            target_os: windows
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binary inside build/
        run: |
          mkdir -p build/dist
          output_name="rclone-${{ matrix.target_os }}-${{ matrix.goarch }}${{ matrix.ext }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -v -trimpath -ldflags="-s -w" -o "build/dist/${output_name}" rclone.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rclone-${{ matrix.target_os }}-${{ matrix.goarch }}
          path: build/dist/*
          if-no-files-found: error
